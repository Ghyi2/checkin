name: 跑
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '10 16 * * *'
jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci
      - name: 执行签到
        run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
